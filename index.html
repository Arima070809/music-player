<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!--LEFT SIDE-->
        <aside class="playlist-panel">
            <div class="top-bar">
                <input
                    type="text"
                    id="search"
                    placeholder="Search songs...">
                <button id="themeBtn">🌙</button>
            </div>
            <div class="playlist-controls">
                <h3>Playlist</h3>
                <label for="songPicker" id="uploadBtn">+</label>
                <input
                    type="file"
                    id="songPicker"
                    accept="audio/*"
                    multiple
                    hidden>
            </div>
            <p id="stats">Songs: 0</p>
            <ol id="playlist">
                <li>No songs loaded</li>
                <!-- Songs will be added by JavaScript -->
            </ol>
        </aside>
        <main class="player-panel">
            <h1>Music Player</h1>
            <img id="cover" src="images/default-artwork.png" alt="Album Cover">

            <div class="song-info">
                <h2 id="songTitle">Song Title</h2>
                <p id="artist">Artist Name</p>
            </div>

            <audio id="audio">
                Your browser does not support audio.
            </audio>

            <div class="time-container">
                <span id="currentTime">0:00</span>

                <input
                    type="range"
                    id="progress"
                    min="0"
                    max="100"
                    value="0">

                <span id="duration">0:00</span>
            </div>

            <div class="controls">
                <button id="favoriteBtn">♥</button>
                <button id="shuffleBtn">⇄</button>
                <button id="prevBtn">
                    <i class="fa-solid fa-backward"></i>
                </button>

                <button id="playBtn">
                    <i class="fa-solid fa-play"></i>
                </button>

                <button id="nextBtn">
                    <i class="fa-solid fa-forward"></i>
                </button>
                <button id="repeatBtn">↻</button>
            </div>

            <div class="volume-container">
                <span id="volumeIcon">🔊</span>

                <input
                    type="range"
                    id="volume"
                    min="0"
                    max="1"
                    step="0.01"
                    value="1">
            </div>
        </main>
    </div>

    <div id="miniPlayer">
        <img
            id="miniCover"
            src="images/default-artwork.png">
        <div>
            <p id="miniTitle">No Song</p>
        </div>
    </div>
    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsmediatags@3.9.7/dist/jsmediatags.min.js"></script>

</body>
</html>
